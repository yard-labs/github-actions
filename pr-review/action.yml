name: Claude PR review
description: Reviews a pull request with inline comments and one summary review, approving or asking for human review.

# Needs, in the calling job: a checkout of the PR head with fetch-depth: 0 (on
# issue_comment runs, check out refs/pull/<n>/head: the default checkout is
# main), and permissions id-token: write (for federation), contents: read and
# pull-requests: write. Auth: either anthropic_api_key, or the four
# anthropic_*_id federation inputs.

inputs:
  pr_number:
    description: The pull request to review.
    default: ${{ github.event.pull_request.number || github.event.issue.number }}
  github_token:
    description: Token used to read the PR and post the review.
    default: ${{ github.token }}
  anthropic_api_key:
    description: Anthropic API key. Leave empty when using federation.
    default: ''
  anthropic_federation_rule_id:
    description: Workload identity federation rule ID.
    default: ''
  anthropic_organization_id:
    description: Anthropic organization ID, for federation.
    default: ''
  anthropic_service_account_id:
    description: Anthropic service account ID, for federation.
    default: ''
  anthropic_workspace_id:
    description: Anthropic workspace ID, for federation.
    default: ''

runs:
  using: composite
  steps:
    # Into the workspace, not .claude/skills: claude-code-action replaces the
    # whole .claude/ tree with the PR base branch's copy before Claude runs.
    - shell: bash
      run: |
        mkdir -p .review-skills
        rm -rf .review-skills/pr-review
        cp -R "$GITHUB_ACTION_PATH" .review-skills/pr-review

    - uses: anthropics/claude-code-action@v1
      with:
        github_token: ${{ inputs.github_token }}
        # Federation exchanges the run's GitHub OIDC token for a short-lived
        # Anthropic credential, so no API key is stored. Any workflow in the
        # calling repo that requests id-token: write can mint it, so keep that
        # permission off jobs that do not need it.
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
        anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
        anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
        anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}

        # Read-only plus gh, which is what posting a review needs. No write
        # tools: this reviews, it never edits the branch.
        claude_args: '--allowedTools "Bash(gh:*),Read,Grep,Glob"'

        prompt: |
          Read .review-skills/pr-review/SKILL.md and follow it exactly to
          review pull request #${{ inputs.pr_number }}
          in ${{ github.repository }}.

          Read it from the checkout rather than relying on skill discovery,
          and stop with an error if the file is missing — a review written
          without those rules looks plausible and checks none of them.

          This is an automated review. Say so once in the summary body, and
          not on individual comments.
